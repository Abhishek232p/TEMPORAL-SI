name: Create/Delete Neon Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: neon-pr-${{ github.event.number }}

permissions:
  contents: read

jobs:
  create_neon_branch:
    name: Create Neon Branch
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Set branch expiration (14 days)
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply migrations to the Neon branch
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m alembic upgrade head

      - name: Verify Neon migration and schema
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import os

          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, inspect, text

          database_url = os.environ.get("DATABASE_URL")
          if not database_url:
              raise RuntimeError("DATABASE_URL is not set for Neon branch verification")

          engine = create_engine(database_url)
          with engine.connect() as connection:
              if connection.dialect.name != "postgresql":
                  raise RuntimeError("Neon verification requires PostgreSQL")
              database_name, schema_name = connection.execute(
                  text("SELECT current_database(), current_schema()")
              ).one()
              current_revision = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          expected_revision = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          if current_revision != expected_revision:
              raise RuntimeError(
                  f"Neon migration revision {current_revision} does not match "
                  f"repository head {expected_revision}"
              )

          print(
              f"Verified PostgreSQL database '{database_name}', schema '{schema_name}', "
              f"migration revision {current_revision}"
          )
          engine.dispose()
          PY

      - name: Run database regression tests
        run: python -m pytest tests/database -q

  delete_neon_branch:
    name: Delete Neon Branch
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

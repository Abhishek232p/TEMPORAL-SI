services:
  - type: web
    name: temporal-intelligence-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn applications.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
